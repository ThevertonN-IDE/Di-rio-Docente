<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diário Docente</title>

  <!-- Prevenção de Cache no Navegador -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Tailwind CSS via CDN (Motor de Estilos) -->
  <link rel="stylesheet" href="styles/tailwind.css">

  <!-- Interações e Estilos Personalizados -->
  <link rel="stylesheet" href="styles/interacoes.css">
  <!-- Estilos de Impressão A4 -->
  <link rel="stylesheet" href="styles/print-a4.css">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- SheetJS & Chart.js -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Favicon da aba -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon.png">

  <!-- Ícone para iOS ao salvar na tela de início -->
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">

  <!-- Manifest do PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta id="theme-color-meta" name="theme-color" content="#4338ca">
</head>

<body
  class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased selection:bg-indigo-100 selection:text-indigo-800">

  <!-- Header Global -->
  <header id="app-header" class="no-print bg-white border-b border-slate-200 sticky top-0 z-20 hidden shadow-sm md:pl-64">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">

      <!-- Marca visível apenas no Mobile -->
      <a href="#dashboard" class="flex md:hidden items-center gap-2 font-black text-indigo-700 text-base tracking-tight">
        <span class="text-xl">📖</span>
        <span>Diário Docente</span>
      </a>

      <!-- Identificação no Desktop -->
      <div class="hidden md:flex items-center text-xs text-slate-400 font-medium">
        <span>Painel do Professor</span>
      </div>

      <!-- Botão Hambúrguer Mobile -->
      <button id="btn-mobile-menu" type="button"
        class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Ações do Desktop -->
      <div id="nav-desktop" class="hidden md:flex items-center gap-3">
        <button id="btn-gerar-backup" type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">
          💾 Fazer Backup
        </button>
        <div id="desktop-logout-slot"></div>
      </div>
    </div>

    <!-- Gaveta Mobile -->
    <div id="menu-mobile" class="hidden md:hidden border-t border-slate-100 px-4 py-3 space-y-2 bg-white shadow-lg">
      <a href="#dashboard" class="mobile-nav-link block py-2 text-sm font-semibold text-slate-700 hover:text-indigo-600">Turmas</a>
      <a href="#meus-trabalhos" class="mobile-nav-link block py-2 text-sm font-semibold text-slate-700 hover:text-indigo-600 flex items-center gap-1">
        <span>📚</span> Meus Trabalhos
      </a>
      <a href="#estudio-a4" class="mobile-nav-link block py-2 text-sm font-semibold text-slate-700 hover:text-indigo-600">Estúdio Provas & Listas A4</a>
      <a href="#apostilas" class="mobile-nav-link block py-2 text-sm font-semibold text-slate-700 hover:text-indigo-600">Apostilas Didáticas</a>
      <a href="#planos-aula" class="mobile-nav-link block py-2 text-sm font-semibold text-slate-700 hover:text-indigo-600">Planos de Aula (BNCC)</a>
      <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
        <button id="btn-gerar-backup-mobile" type="button"
          class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">
          💾 Fazer Backup
        </button>
        <div id="mobile-logout-slot"></div>
      </div>
    </div>
  </header>

  <!-- Container SPA -->
  <main id="app" class="w-full pb-24 md:pb-8 min-h-[calc(100vh-4rem)] md:pl-64"></main>

  <!-- Script principal modular -->
  <script type="module" src="./src/app.js"></script>
</body>

</html>
