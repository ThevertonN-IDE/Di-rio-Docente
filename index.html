<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário Docente</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Estilos de Impressão A4 Milimétrica -->
  <link rel="stylesheet" href="styles/print-a4.css">
  
  <!-- KaTeX para Fórmulas Matemáticas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased">

  <!-- Barra de Navegação Global (Oculta na Impressão) -->
  <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="#dashboard" class="flex items-center gap-2 font-black text-indigo-700 text-lg tracking-tight">
        <span>📖</span> Diário Docente
      </a>
      <nav class="flex items-center gap-4 text-sm font-semibold text-slate-600">
        <a href="#dashboard" class="hover:text-indigo-600 transition">Turmas</a>
        <a href="#provas" class="hover:text-indigo-600 transition">Criador de Provas A4</a>
      </nav>
    </div>
  </header>

  <!-- Contêiner Reativo Principal (SPA) -->
  <main id="app" class="w-full"></main>

  <!-- Script Principal Modular -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
